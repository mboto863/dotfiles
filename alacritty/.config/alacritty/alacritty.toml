[general]
# Live-relod the config when saving.
live_config_reload = true

[window]
decorations = "full"

[font]
size = 12.0

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Regular"

[font.bold]
family = "JetBrainsMono Nerd Font"
style = "Bold"

[font.italic]
family = "JetBrainsMono Nerd Font"
style = "Italic"

# ===== Gruvbox Light (medium contrast) =====
[colors.primary]
background = "#fbf1c7"
foreground = "#3c3836"

[colors.normal]
black   = "#fbf1c7"
red     = "#cc241d"
green   = "#98971a"
yellow  = "#d79921"
blue    = "#458588"
magenta = "#b16286"
cyan    = "#689d6a"
white   = "#7c6f64"

[colors.bright]
black   = "#928374"
red     = "#9d0006"
green   = "#79740e"
yellow  = "#b57614"
blue    = "#076678"
magenta = "#8f3f71"
cyan    = "#427b58"
white   = "#3c3836"

[colors.cursor]
text   = "#fbf1c7"
cursor = "#3c3836"

[colors.selection]
text       = "#fbf1c7"
background = "#3c3836"
