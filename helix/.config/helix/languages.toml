# Enable Python LSP + Linter (Pyright + Ruff)
[[language]]
name = "python"
language-servers = ["pyright", "ruff"]
auto-format = true
scope = "source.python"

[language-server.ruff]
command = "ruff"
args = ["server"]

[language.formatter]
command = "ruff"
args = ["format", "-"]

# Enable SQL LSP for editing queries
[[language]]
name = "sql"
language-servers = ["sqls"]
