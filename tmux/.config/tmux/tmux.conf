# use vi mode
setw -g mode-keys vi
set -g status-keys vi

# true colors
set-option -sa terminal-features ',xterm-256color:RGB'

# change prefix to backtick
unbind C-b
set-option -g prefix `
bind ` send-prefix

# start with window 1 (instead of 0)
set -g base-index 1

# start with pane 1
set -g pane-base-index 1
